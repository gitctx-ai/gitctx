- request:
    body: '{"input": ["\"\"\"JWT-based authentication middleware class for token verification.\"\"\"\n\nimport
      jwt\n\n\nclass JWTAuthMiddleware:\n    \"\"\"JWT authentication middleware class
      for handling JSON Web Tokens.\n\n    This middleware class implements JWT-based
      auth for verifying user tokens.\n    Validates JWT tokens on each request to
      ensure secure authentication.\n    Primary middleware class for JWT authentication
      in the auth module.\n    \"\"\"\n\n    def __init__(self, secret_key):\n        self.secret_key
      = secret_key\n        self.algorithm = \"HS256\"\n\n    def verify_token(self,
      token):\n        \"\"\"Verify JWT token signature and claims for authentication.\n\n        This
      JWT auth method validates tokens to confirm user identity.\n\n        Args:\n            token:
      JWT token string\n\n        Returns:\n            Decoded JWT token payload
      if valid\n\n        Raises:\n            jwt.InvalidTokenError: If JWT token
      is invalid or expired\n        \"\"\"\n        return jwt.decode(token, self.secret_key,
      algorithms=[self.algorithm])\n\n    def create_jwt_token(self, user_id):\n        \"\"\"Create
      new JWT token for authenticated user.\"\"\"\n        payload = {\"user_id\":
      user_id}\n        return jwt.encode(payload, self.secret_key, algorithm=self.algorithm)"],
      "model": "text-embedding-3-large", "dimensions": 3072, "encoding_format": "base64"}'
