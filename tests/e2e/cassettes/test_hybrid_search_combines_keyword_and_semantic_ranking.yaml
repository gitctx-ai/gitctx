      authentication.\"\"\"\n\n\nclass OAuthMiddleware:\n    \"\"\"OAuth authentication
      middleware class for external auth providers.\n\n    This middleware class implements
      OAuth 2.0 auth flow for authenticating users\n    via third-party services.
      Middleware class handles OAuth authentication with\n    providers like Google,
      GitHub, or Facebook.\n    \"\"\"\n\n    def __init__(self, client_id, client_secret):\n        self.client_id
      = client_id\n        self.client_secret = client_secret\n        self.provider
      = \"oauth\"\n\n    def handle_callback(self, code):\n        \"\"\"Handle OAuth
      callback with authorization code for authentication.\n\n        OAuth middleware
      method that exchanges authorization code for access token.\n\n        Args:\n            code:
      Authorization code from OAuth provider\n\n        Returns:\n            Access
      token and user information from OAuth auth\n        \"\"\"\n        token =
      self.exchange_code(code)\n        return {\"access_token\": token, \"provider\":
      self.provider}\n\n    def exchange_code(self, code):\n        \"\"\"Exchange
      OAuth authorization code for access token.\"\"\"\n        # OAuth authentication
      logic\n        return f\"oauth_token_{code}\""], "model": "text-embedding-3-large",
